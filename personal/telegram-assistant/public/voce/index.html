<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Jarvis</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#07080c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --fundal: #07080c;
    --panou: rgba(16, 19, 26, 0.82);
    --text: #eef2f7;
    --stins: #7d8899;
    --accent: #45e0b0;
    --rosu: #ff5f6d;
    --contur: rgba(255, 255, 255, 0.09);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--fundal);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* Orbul e ecranul. Tot restul stă ascuns până ceri tu.
     Desenat in canvas, nu in CSS: forma se recalculeaza din esantioane audio la fiecare cadru,
     iar o animatie CSS are o curba fixa - n-ar putea urmari vocea. */
  #orb {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    touch-action: none;
  }

  /* ─── Scena ─────────────────────────────────────────────────────────────────────────── */

  .scena {
    position: relative;
    z-index: 1;
    height: 100dvh;
    display: grid;
    place-items: center;
    /* Linia de sub orb, calculata o singura data: si statusul, si butonul de microfon atarna
       de ea, deci daca se muta orbul nu trebuie corectate doua formule care se pot desincroniza. */
    --sub-orb: calc(44% + min(34vw, 31vh) + 34px);
  }

  /* Zona de atins E orbul, nu tot ecranul: o atingere greșită într-un colț nu are voie să
     închidă apelul. Cerc, cât orbul mare, centrat pe el. */
  #orb-buton {
    position: absolute;
    top: 44%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(68vw, 62vh);
    height: min(68vw, 62vh);
    border: 0;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    padding: 0;
  }
  #orb-buton:focus-visible { outline: 2px solid var(--accent); outline-offset: 8px; }

  /* Sub orb, o singură linie. Fără ea, primul contact cu aplicația e un ecran negru cu o bilă. */
  #status {
    position: absolute;
    top: var(--sub-orb);
    left: 50%;
    transform: translateX(-50%);
    margin: 0;
    width: 86vw;
    text-align: center;
    font-size: 15px;
    letter-spacing: 0.01em;
    color: var(--stins);
    transition: color 0.3s ease;
    pointer-events: none;
  }
  #status[data-state="live"] { color: rgba(238, 242, 247, 0.72); }
  #status[data-state="error"] { color: var(--rosu); }

  /* Microfonul, pe ecranul principal și nu în meniu: e singurul buton pe care îl cauți CU
     ADEVĂRAT repede — cineva intră în cameră și vrei să taci pe loc. Prin meniu însemna trei
     gesturi și o secundă în care te aude.

     Centrat sub linia de status, la distanță de orb: destul de departe cât să nu-l atingi când
     vrei să închizi apelul, destul de aproape cât să fie evident că ține de el. */
  #mut {
    position: absolute;
    top: calc(var(--sub-orb) + 52px);
    left: 50%;
    transform: translateX(-50%);
    /* Cerc, nu pastilă: fără cuvânt înăuntru, o pastilă lungă ar arăta goală. 54px e ținta de
       atins recomandată — aici se apasă în grabă, uneori fără să te uiți. */
    width: 54px;
    height: 54px;
    padding: 0;
    display: grid;
    place-items: center;
  }
  #mut svg {
    width: 24px;
    height: 24px;
    fill: none;
    /* Iconița moștenește culoarea butonului, deci roșul stării „oprit" o colorează singur. */
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* Starea se citește din FORMĂ, nu doar din culoare: tăietura apare doar când microfonul e oprit.
     Culoarea singură ar lăsa pe dinafară pe oricine n-o distinge. */
  #mut .taietura { display: none; }
  #mut[aria-pressed="true"] .taietura { display: block; }

  /* ─── Mânerul meniului ──────────────────────────────────────────────────────────────── */
  /* O dungă subțire pe marginea din dreapta: se vede cât să știi că e acolo, nu cât să conteze. */

  #maner {
    position: fixed;
    z-index: 3;
    top: 50%;
    right: 0;
    transform: translateY(-50%);
    width: 34px;
    height: 92px;
    border: 0;
    background: transparent;
    display: grid;
    place-items: center;
    cursor: pointer;
    padding: 0;
  }
  #maner::before {
    content: "";
    width: 4px;
    height: 54px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.22);
    transition: background 0.2s ease, height 0.2s ease;
  }
  #maner:hover::before,
  #maner:focus-visible::before { background: rgba(255, 255, 255, 0.5); height: 64px; }
  #maner[aria-expanded="true"] { opacity: 0; pointer-events: none; }

  /* ─── Meniul ────────────────────────────────────────────────────────────────────────── */

  #voal {
    position: fixed;
    inset: 0;
    z-index: 4;
    background: rgba(0, 0, 0, 0.45);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #voal[data-deschis="true"] { opacity: 1; pointer-events: auto; }

  #meniu {
    position: fixed;
    z-index: 5;
    top: 0;
    right: 0;
    height: 100dvh;
    width: min(88vw, 380px);
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 18px);
    background: var(--panou);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border-left: 1px solid var(--contur);
    transform: translateX(100%);
    transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
  }
  #meniu[data-deschis="true"] { transform: translateX(0); }

  .meniu-cap {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .meniu-cap h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  #inchide-meniu {
    margin-left: auto;
    border: 0;
    background: transparent;
    color: var(--stins);
    font: inherit;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 6px;
  }

  .randuri {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .pastila {
    flex: none;
    padding: 9px 15px;
    border: 1px solid var(--contur);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.04);
    color: var(--stins);
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .pastila[aria-pressed="true"] {
    color: var(--text);
    border-color: rgba(69, 224, 176, 0.45);
    background: rgba(69, 224, 176, 0.1);
  }
  .pastila:disabled { opacity: 0.35; cursor: default; }
  /* Microfonul oprit e singura stare care trebuie să sară în ochi de pe ecran. */
  #mut[aria-pressed="true"] {
    color: var(--rosu);
    border-color: rgba(255, 95, 109, 0.5);
    background: rgba(255, 95, 109, 0.12);
  }

  /* O linie de stare, nu un buton: text simplu, aliniat cu restul meniului. Apăsabilă doar când
     chiar are ce face — când integrarea e pornită, e inertă și arată ca ce este, o informație. */
  .stare {
    display: block;
    width: 100%;
    padding: 2px 0;
    border: 0;
    background: none;
    color: var(--stins);
    font: inherit;
    font-size: 13px;
    text-align: left;
    cursor: default;
  }
  .stare:not(:disabled) {
    color: var(--text);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }

  #call {
    padding: 14px;
    border: 0;
    border-radius: 16px;
    background: var(--accent);
    color: #04140e;
    font: inherit;
    font-size: 16px;
    font-weight: 650;
    cursor: pointer;
  }
  #call[data-active="true"] { background: var(--rosu); color: #fff; }
  #call:active { filter: brightness(0.92); }

  #transcript {
    flex: 3;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 4px 2px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }

  .bubble {
    margin: 0;
    max-width: 90%;
    padding: 9px 13px;
    border-radius: 16px;
    font-size: 15px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .bubble[data-role="user"] {
    align-self: flex-end;
    background: rgba(88, 104, 160, 0.4);
    border-bottom-right-radius: 5px;
  }
  .bubble[data-role="assistant"] {
    align-self: flex-start;
    background: rgba(255, 255, 255, 0.07);
    border-bottom-left-radius: 5px;
  }

  .note {
    margin: 0;
    align-self: center;
    font-size: 13px;
    color: var(--stins);
  }

  /* Ce s-a vorbit înainte. Ocupă mai puțin decât apelul curent (2fr față de 3fr, mai jos): e
     context, nu subiectul de pe ecran. */
  #istoric {
    flex: 2;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 4px 2px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    opacity: 0.72; /* trecutul e mai stins decât prezentul, fără să devină ilizibil */
  }

  /* Granița dintre „înainte" și „acum", ca o linie cu un cuvânt pe ea. */
  .separator {
    margin: 2px 0;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--stins);
  }
  .separator::before,
  .separator::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--contur);
  }

  /* Mesajele scrise pe Telegram, în același fir: istoricul e comun (un singur agent), iar fără
     marcaj ar părea că s-au spus cu voce în apelul ăsta. Chenar + etichetă, nu doar culoare. */
  .bubble[data-canal="telegram"] {
    border-left: 2px solid rgba(88, 104, 160, 0.7);
    padding-left: 11px;
  }
  .bubble .canal {
    display: block;
    margin-top: 4px;
    font-size: 11px;
    color: var(--stins);
  }

  #text-form { display: flex; gap: 8px; }

  #text-input {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border: 1px solid var(--contur);
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.04);
    color: var(--text);
    font: inherit;
    font-size: 16px; /* sub 16px, iOS mărește pagina la focus */
  }
  #text-input::placeholder { color: var(--stins); }
  #text-input:focus { outline: none; border-color: rgba(69, 224, 176, 0.5); }

  #text-form button {
    padding: 12px 16px;
    border: 1px solid var(--contur);
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.04);
    color: var(--text);
    font: inherit;
    cursor: pointer;
  }

  /* Rândul de diagnostic: rata microfonului, starea redării, blocuri primite. Pe telefon nu
     există consolă, iar "nu aud nimic" are cel puțin trei cauze care arată identic. */
  #diag {
    margin: 0;
    font-size: 11px;
    color: #5a6472;
    font-variant-numeric: tabular-nums;
    min-height: 15px;
  }
</style>
</head>
<body>

<canvas id="orb" aria-hidden="true"></canvas>

<main class="scena">
  <button id="orb-buton" type="button" aria-label="Sună"></button>
  <p id="status">Atinge cercul ca să vorbim.</p>
  <!-- Doar iconița. `aria-label` NU e un moft aici: fără textul „Microfon", el rămâne singurul
       nume al butonului pentru cititoarele de ecran. app.js îl rescrie la fiecare comutare. -->
  <button id="mut" class="pastila" type="button" aria-pressed="false" disabled
          aria-label="Oprește microfonul">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M12 3.5a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0v-5a3 3 0 0 1 3-3Z"/>
      <path d="M5.5 11a6.5 6.5 0 0 0 13 0"/>
      <path d="M12 17.5V21"/>
      <!-- Tăietura apare doar când microfonul e oprit: forma spune starea, nu doar culoarea. -->
      <line class="taietura" x1="4.5" y1="4.5" x2="19.5" y2="19.5"/>
    </svg>
  </button>

</main>

<button id="maner" type="button" aria-label="Deschide meniul" aria-expanded="false"
        aria-controls="meniu"></button>

<div id="voal" data-deschis="false"></div>

<aside id="meniu" data-deschis="false" aria-hidden="true">
  <div class="meniu-cap">
    <h1>Jarvis</h1>
    <button id="inchide-meniu" type="button" aria-label="Închide meniul">×</button>
  </div>

  <div class="randuri">
    <button id="auto" class="pastila" type="button" aria-pressed="true"
            title="Sună singur când deschizi aplicația">Pornire automată</button>
  </div>

  <!-- NU un buton, ci o stare: singurul lucru pe care vrei să-l afli despre WhatsApp e că
       integrarea există. Devine apăsabilă DOAR când lipsește accesul la notificări — permisiunea
       aia nu poate fi cerută printr-un dialog, doar acordată manual din Setări, deci trebuie să
       rămână o cale spre ea. Ascunsă pe web, unde noțiunea nici nu există. -->
  <button id="whatsapp" class="stare" type="button" hidden disabled></button>

  <!-- Aceeași formă, din același motiv (vezi regula 49): permisiunea de microfon, odată refuzată,
       nu se mai poate cere printr-un dialog. Apare doar în aplicația nativă și doar după un refuz. -->
  <button id="microfon-acces" class="stare" type="button" hidden disabled></button>

  <button id="call" type="button" data-active="false">Sună</button>

  <!-- Două cutii, nu una: sus ce s-a vorbit înainte (încărcat din istoric la prima deschidere a
       sertarului), jos apelul de acum. Separatorul e chiar granița dintre ele. -->
  <div id="istoric" aria-label="Ce s-a vorbit înainte" hidden></div>
  <p class="separator" id="separator-acum" hidden>apelul de acum</p>

  <div id="transcript" aria-live="polite"></div>

  <form id="text-form" autocomplete="off">
    <input id="text-input" type="text" placeholder="…sau scrie" enterkeyhint="send">
    <button type="submit">Trimite</button>
  </form>

  <p id="diag"></p>
</aside>

<script src="orb.js"></script>
<script src="app.js"></script>
</body>
</html>

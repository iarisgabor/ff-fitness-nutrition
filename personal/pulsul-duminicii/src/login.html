<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Pulsul Duminicii — autentificare</title>
__SHARED_HEAD__
<style>
__SHARED_CSS__

.auth-wrap{min-height:calc(100vh - 80px); display:flex; align-items:center; justify-content:center; padding:40px 16px;}
.auth-card{width:100%; max-width:400px; padding:32px 28px;}
.auth-brand{display:flex; align-items:center; gap:10px; margin-bottom:26px;}
.auth-brand svg{width:30px; height:30px;}
.auth-brand b{font-family:var(--font-display); font-weight:700; font-size:16px; letter-spacing:.02em;}
.auth-card h1{font-size:22px; font-weight:700;}
.auth-card .lead{font-size:13.5px; color:var(--text-2); margin-top:6px; line-height:1.5;}
.auth-form{display:flex; flex-direction:column; gap:14px; margin-top:22px;}
.auth-form .btn{padding:12px 16px; font-size:14px; margin-top:4px;}
.auth-foot{margin-top:18px; font-size:12px; color:var(--text-3); line-height:1.5;}
.auth-wrap{min-height:calc(100dvh - 80px); padding-top:calc(40px + env(safe-area-inset-top));}
.pw-field{position:relative;}
.pw-field .input{padding-right:52px;}
.pw-toggle{
  position:absolute; right:2px; bottom:2px; width:44px; height:40px; border:none; background:none; cursor:pointer;
  color:var(--text-3); display:flex; align-items:center; justify-content:center; border-radius:9px;
}
.pw-toggle svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
.pw-toggle[aria-pressed="true"]{color:var(--accent-mark);}
@media (max-width:760px){
  .auth-card{padding:26px 20px;}
  .auth-form .btn{min-height:50px; font-size:15px;}
}
</style>
</head>
<body>

<div class="topbar" id="topbar-root"></div>

<div class="auth-wrap">
  <div class="card auth-card">
    <div class="auth-brand" id="auth-brand">
      <svg viewBox="0 0 26 26" fill="none"><path d="M1 13H7L10 4L16 22L19 13H25" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <b>PULSUL DUMINICII</b>
    </div>
    <h1 id="auth-title">Autentificare</h1>
    <p class="lead" id="auth-lead">Intră cu contul primit de la biserică.</p>

    <form class="auth-form" id="login-form" method="post" action="/login">
      <div id="error-slot"></div>
      <label class="field"><span>Utilizator</span>
        <input class="input" name="username" id="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" required>
      </label>
      <label class="field"><span>Parolă</span>
        <span class="pw-field"><input class="input" type="password" name="password" autocomplete="current-password" enterkeyhint="go" required></span>
      </label>
      <input type="hidden" name="next" id="next">
      <button class="btn primary" type="submit">Intră</button>
    </form>

    <form class="auth-form" id="password-form" hidden>
      <div id="pw-error-slot"></div>
      <label class="field"><span>Parola curentă</span>
        <input class="input" type="password" name="current" autocomplete="current-password" required>
      </label>
      <label class="field"><span>Parola nouă (minim 8 caractere)</span>
        <input class="input" type="password" name="password" autocomplete="new-password" minlength="8" required>
      </label>
      <label class="field"><span>Repetă parola nouă</span>
        <input class="input" type="password" name="password2" autocomplete="new-password" minlength="8" required>
      </label>
      <button class="btn primary" type="submit">Schimbă parola</button>
    </form>

    <p class="auth-foot" id="auth-foot">Ai uitat parola? Cere-i contului general (BisericaLogos) să ți-o reseteze.</p>
  </div>
</div>

<script>
__SHARED_JS__
</script>
<script>
(function(){
  const PAYLOAD = __PULS_DATA_JSON__;

  const EYE = '<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  document.querySelectorAll('input[type=password]').forEach((input) => {
    let wrap = input.closest('.pw-field');
    if (!wrap) { wrap = document.createElement('span'); wrap.className = 'pw-field'; input.before(wrap); wrap.appendChild(input); }
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'pw-toggle'; btn.innerHTML = EYE;
    btn.setAttribute('aria-label', 'Arată parola'); btn.setAttribute('aria-pressed', 'false');
    btn.addEventListener('click', () => {
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.setAttribute('aria-pressed', String(show));
      btn.setAttribute('aria-label', show ? 'Ascunde parola' : 'Arată parola');
    });
    wrap.appendChild(btn);
  });

  if (PAYLOAD.mode === 'password') {
    initNav('account', '');
    document.getElementById('auth-brand').hidden = true;
    document.getElementById('auth-title').textContent = 'Schimbă parola';
    document.getElementById('auth-lead').textContent = 'După schimbare rămâi autentificat pe acest dispozitiv.';
    document.getElementById('auth-foot').hidden = true;
    document.getElementById('login-form').hidden = true;
    const form = document.getElementById('password-form');
    form.hidden = false;
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const slot = document.getElementById('pw-error-slot');
      slot.innerHTML = '';
      if (fd.get('password') !== fd.get('password2')) {
        slot.innerHTML = '<div class="form-error">Parolele noi nu coincid.</div>';
        return;
      }
      try {
        await withBusy(form.querySelector('[type=submit]'), () => api('POST', '/api/parola', { current: fd.get('current'), password: fd.get('password') }));
        form.reset();
        toast('Parola a fost schimbată.');
      } catch (err) {
        slot.innerHTML = `<div class="form-error">${esc(err.message)}</div>`;
      }
    });
    return;
  }

  // login: fără topbar — nu există încă un utilizator pentru meniu
  document.getElementById('topbar-root').remove();
  document.getElementById('next').value = PAYLOAD.next || '';
  if (PAYLOAD.username) document.getElementById('username').value = PAYLOAD.username;
  if (PAYLOAD.error) {
    document.getElementById('error-slot').innerHTML = `<div class="form-error" role="alert">${esc(PAYLOAD.error)}</div>`;
  }
  (PAYLOAD.username ? document.querySelector('[name=password]') : document.getElementById('username')).focus();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Pulsul Duminicii — program</title>
__SHARED_HEAD__
<style>
__SHARED_CSS__

.page-head{padding:34px 0 0;}
.back-link{font-size:12.5px; color:var(--text-3); text-decoration:none; display:inline-flex; align-items:center; gap:5px; margin-bottom:14px;}
.back-link:hover{color:var(--text);}
.head-row{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;}
.page-head h1{font-size:clamp(22px,3vw,30px); font-weight:700;}
.head-meta{margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;}
.head-meta .chip{font-size:12px; padding:4px 11px;}
.head-actions{display:flex; gap:8px; flex-wrap:wrap;}

.info-grid{display:grid; grid-template-columns: 1.1fr 1fr; gap:16px; margin-top:24px;}
@media (max-width:900px){ .info-grid{grid-template-columns:1fr;} }
.info-card{padding:20px 22px;}
.info-card h3{font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-3); margin-bottom:14px;}
.settings-grid{display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:12px;}
.settings-grid .wide{grid-column:1 / -1;}
@media (max-width:560px){ .settings-grid{grid-template-columns:1fr 1fr;} .settings-grid .p-name{grid-column:1 / -1;} }
.info-actions{display:flex; gap:8px; margin-top:14px; align-items:center; flex-wrap:wrap;}
.muted{font-size:12px; color:var(--text-3);}
.notes-view{font-size:13.5px; line-height:1.55; white-space:pre-wrap; color:var(--text-2);}

/* ---- planul: listă în stilul Planning Center ---- */
.plan{margin-top:22px; overflow:hidden;}
.plan-head, .plan-row{display:grid; grid-template-columns:26px 50px 58px minmax(0,1fr) 64px; align-items:center; gap:10px; padding:0 14px;}
.plan-head{height:40px; font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text-3); border-bottom:1px solid var(--border);}
.plan-row{min-height:46px; border-bottom:1px solid var(--border); cursor:pointer; position:relative;}
.plan-row:last-child{border-bottom:none;}
.plan-row:hover{background:color-mix(in srgb, var(--surface-2) 70%, transparent);}
.plan-row.header{background:var(--surface-2); min-height:36px; cursor:default;}
.plan-row.header.clickable{cursor:pointer;}
.plan-row.header .h-title{font-family:var(--font-display); font-weight:700; font-size:12px; letter-spacing:.06em; text-transform:uppercase; display:flex; align-items:center; gap:10px;}
.plan-row.header .h-total{font-family:var(--font-mono); font-size:11px; color:var(--text-3); font-weight:500; letter-spacing:0;}
.plan-row.readonly{cursor:pointer;}
.plan-row.dragging{opacity:.35;}
.plan-row.drop-before{box-shadow: inset 0 2px 0 var(--accent-mark);}
.plan-row.drop-after{box-shadow: inset 0 -2px 0 var(--accent-mark);}
.grip{color:var(--text-3); cursor:grab; display:flex; align-items:center; justify-content:center; height:100%; touch-action:none;}
.grip svg{width:12px; height:16px; fill:currentColor;}
.grip.off{visibility:hidden;}
.c-time{font-family:var(--font-mono); font-size:11.5px; color:var(--text-3); font-variant-numeric:tabular-nums;}
.c-len{font-family:var(--font-mono); font-size:12.5px; font-variant-numeric:tabular-nums; color:var(--text-2);}
.c-title{padding:8px 0; min-width:0;}
.c-title .t{font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:7px; min-width:0;}
.c-title .t .txt{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.c-title .t .ph{color:var(--text-3); font-weight:600; font-style:italic;}
.c-title .s{font-size:12px; color:var(--text-3); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.key-badge{flex:none; display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:20px; padding:0 5px; border-radius:999px; background:var(--r5); color:#fff; font-size:10.5px; font-weight:800;}
.c-res{display:flex; justify-content:flex-end; align-items:center; gap:4px; font-size:12px; color:var(--text-2); font-weight:700;}
.c-res svg{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:1.8;}
.edit-dot{width:6px; height:6px; border-radius:50%; background:var(--accent-mark); position:absolute; left:6px; top:50%; transform:translateY(-50%);}
.add-in-section{display:flex; gap:6px; justify-content:flex-end;}
.add-in-section .btn{padding:3px 9px; font-size:11px; border-radius:7px; background:var(--surface);}
.plan-foot{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 14px; border-top:1px solid var(--border); flex-wrap:wrap;}
.plan-foot .total{font-size:13px; color:var(--text-2);}
.plan-foot .total b{font-family:var(--font-mono); color:var(--text);}
@media (max-width:640px){
  /* pe telefon: ora de început (utilă duminică dimineața) în locul mânerului de tragere,
     care oricum nu merge cu degetul — mutarea rămâne din panou, cu ↑ ↓ */
  .plan-head, .plan-row{grid-template-columns:42px 40px minmax(0,1fr) 30px; padding:0 12px; gap:8px;}
  .plan-head{letter-spacing:.04em;}
  .grip, .plan-head > span:first-child{display:none;}
  .plan-row{min-height:54px;}
  .c-time{font-size:11px;}
  .c-len{font-size:12px;}
  .edit-dot{left:3px; width:5px; height:5px;}
  .add-in-section .btn{min-height:40px; min-width:44px; font-size:16px;}
  .plan-row.header{min-height:48px;}
}

/* ---- resurse ---- */
.res-list{display:flex; flex-direction:column; gap:8px;}
.res-item{display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:10px; background:var(--surface-2); min-width:0;}
.res-icon{flex:none; width:30px; height:30px; border-radius:8px; background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; color:var(--accent-mark); font-family:var(--font-mono);}
.res-body{min-width:0; flex:1;}
.res-body a{font-size:13px; font-weight:700; color:var(--text); text-decoration:none; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.res-body a:hover{text-decoration:underline;}
.res-body .res-meta{font-size:11.5px; color:var(--text-3); margin-top:1px;}
.res-del{flex:none; background:none; border:none; color:var(--text-3); cursor:pointer; font-size:18px; line-height:1; padding:4px 6px; border-radius:6px;}
.res-del:hover{color:var(--r1); background:var(--surface);}
.res-add{display:flex; flex-direction:column; gap:10px; margin-top:12px;}
.res-add-row{display:flex; gap:8px; flex-wrap:wrap;}
.res-link-form{display:grid; grid-template-columns:1fr 1.4fr auto; gap:8px;}
@media (max-width:560px){ .res-link-form{grid-template-columns:1fr;} }
.drop-zone{border:1.5px dashed var(--border); border-radius:12px; padding:14px; text-align:center; font-size:12.5px; color:var(--text-3); cursor:pointer;}
.drop-zone:hover, .drop-zone.over{border-color:var(--accent-mark); color:var(--text-2);}
.drop-zone b{color:var(--accent-mark);}
.res-empty{font-size:12.5px; color:var(--text-3);}

/* ---- panoul lateral de editare ---- */
.overlay{position:fixed; inset:0; background:rgba(8,10,18,.45); z-index:80;}
.drawer{
  position:fixed; top:0; right:0; bottom:0; width:min(460px, 100vw); z-index:90;
  background:var(--surface); border-left:1px solid var(--border); box-shadow:var(--shadow);
  display:flex; flex-direction:column;
}
.drawer-head{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:16px 20px; border-bottom:1px solid var(--border);}
.drawer-head h2{font-size:16px; font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.drawer-close{background:none; border:none; font-size:24px; line-height:1; color:var(--text-2); cursor:pointer; padding:4px 8px; border-radius:8px;}
.drawer-close:hover{background:var(--surface-2);}
.drawer-body{padding:18px 20px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:14px;}
.drawer-body h4{font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-3); margin-top:6px;}
.drawer-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.drawer-foot{display:flex; gap:8px; padding:14px 20px; border-top:1px solid var(--border); flex-wrap:wrap;}
.drawer-foot .spacer{flex:1;}
.view-field{font-size:13.5px; line-height:1.5;}
.view-field .lbl{font-size:11.5px; font-weight:700; color:var(--text-3); display:block; margin-bottom:2px;}
.readonly-note{font-size:12px; color:var(--text-3); padding:10px 12px; background:var(--surface-2); border-radius:10px;}
.drawer:not([hidden]){animation:drawer-in .2s ease-out;}
.overlay:not([hidden]){animation:fade-in .2s ease-out;}
@keyframes drawer-in{from{opacity:0; transform:translateX(28px);} to{opacity:1; transform:none;}}
@keyframes fade-in{from{opacity:0;}}
@media (max-width:640px){
  .drawer{top:auto; left:0; width:100%; max-height:92vh; border-left:none; border-top:1px solid var(--border); border-radius:22px 22px 0 0; padding-bottom:env(safe-area-inset-bottom);}
  .drawer:not([hidden]){animation:sheet-up .26s cubic-bezier(.2,.8,.2,1);}
  /* mânerul: trage în jos ca să închizi */
  .drawer-head{position:relative; padding-top:24px; touch-action:none;}
  .drawer-head::before{content:""; position:absolute; top:9px; left:50%; width:40px; height:5px; margin-left:-20px; border-radius:3px; background:var(--border);}
  .drawer-foot #f-save{flex:1;}
}

/* progresul urcării de fișiere */
#upload-panel{
  position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:110;
  width:min(440px, calc(100vw - 24px)); padding:12px 14px; display:flex; flex-direction:column; gap:9px;
  background:var(--surface); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow);
}
body.has-bottom-nav #upload-panel{bottom:calc(80px + env(safe-area-inset-bottom));}
.up-row{display:flex; align-items:center; gap:10px; font-size:13px; font-weight:700; min-width:0;}
.up-name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.up-pct{font-family:var(--font-mono); font-size:12px; color:var(--text-2); flex:none;}
.up-bar{height:6px; border-radius:3px; background:var(--surface-2); overflow:hidden;}
.up-bar i{display:block; height:100%; width:0; background:var(--accent-mark); border-radius:3px; transition:width .15s;}

/* telefon: programul primul, detaliile și resursele generale sub el */
@media (max-width:760px){
  .edit-wrap{display:flex; flex-direction:column;}
  .edit-wrap .page-head{padding-top:16px;}
  .edit-wrap .page-head h1{font-size:22px;}
  .edit-wrap .plan{order:1; margin-top:16px;}
  .edit-wrap .info-grid{order:2; margin-top:16px;}
  .edit-wrap #updated{order:3;}
  .edit-wrap .spacer-end{order:4;}
  .head-actions{width:100%;}
  .head-actions .btn{flex:1;}
}
</style>
</head>
<body>

<div id="tooltip"></div>
<div class="topbar" id="topbar-root"></div>

<div class="wrap edit-wrap">
  <div class="page-head">
    <a href="/program" class="back-link">&larr; toate duminicile</a>
    <div class="head-row">
      <div>
        <h1 id="title"></h1>
        <div class="head-meta" id="head-meta"></div>
      </div>
      <div class="head-actions" id="head-actions"></div>
    </div>
  </div>

  <div class="info-grid">
    <div class="card info-card" id="details-card"></div>
    <div class="card info-card">
      <h3>Resurse generale</h3>
      <div id="general-resources"></div>
    </div>
  </div>

  <div class="card plan">
    <div class="plan-head"><span></span><span class="h-time">Ora</span><span>Durată</span><span>Titlu</span><span style="text-align:right;">Res.</span></div>
    <div id="plan-rows"></div>
    <div class="plan-foot" id="plan-foot"></div>
  </div>

  <p class="muted" id="updated" style="margin-top:12px;"></p>
  <div class="spacer-end" style="height:60px;"></div>
</div>

<div class="overlay" id="overlay" hidden></div>
<aside class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="drawer-title">
  <div class="drawer-head"><h2 id="drawer-title"></h2><button class="drawer-close" id="drawer-close" aria-label="Închide">×</button></div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-foot" id="drawer-foot"></div>
</aside>
<input type="file" id="file-input" multiple hidden accept=".ppt,.pptx,.key,.odp,.pdf,.doc,.docx,.odt,.txt,.pro,.jpg,.jpeg,.png,.gif,.webp,.heic,.mp3,.m4a,.wav,.aac,.mp4,.mov,.m4v">

<script>
__SHARED_JS__
</script>
<script>
(function(){
  const PAYLOAD = __PULS_DATA_JSON__;
  let plan = PAYLOAD.plan;
  const DATE = plan.sunday.date;
  const MAX_UPLOAD = 50 * 1024 * 1024;
  initNav('program', '');

  const GRIP = '<svg viewBox="0 0 12 16"><circle cx="3" cy="3" r="1.4"/><circle cx="9" cy="3" r="1.4"/><circle cx="3" cy="8" r="1.4"/><circle cx="9" cy="8" r="1.4"/><circle cx="3" cy="13" r="1.4"/><circle cx="9" cy="13" r="1.4"/></svg>';
  const CLIP = '<svg viewBox="0 0 16 16"><path d="M11.5 7.5l-4.6 4.6a2.6 2.6 0 01-3.7-3.7l5.3-5.3a1.7 1.7 0 012.4 2.4L5.6 10.8a.8.8 0 01-1.2-1.2l4.6-4.6"/></svg>';

  // ------------------------------------------------------------ utilitare

  function parseDuration(txt){
    const parts = String(txt||'').trim().split(':').map(p => p.trim());
    if (!parts[0]) return 0;
    if (parts.some(p => !/^\d+$/.test(p))) return null;
    const n = parts.map(Number);
    if (n.length === 1) return n[0] * 60;             // "35" = 35 de minute
    if (n.length === 2) return n[0] * 60 + n[1];      // "5:30"
    if (n.length === 3) return n[0] * 3600 + n[1] * 60 + n[2];
    return null;
  }
  function clock(startHHMM, offsetSec){
    const [h, m] = (startHHMM || '10:00').split(':').map(Number);
    const total = Math.round((h * 3600 + m * 60 + offsetSec) / 60);
    return `${String(Math.floor(total / 60) % 24).padStart(2,'0')}:${String(total % 60).padStart(2,'0')}`;
  }
  function fmtSize(b){
    if (!b) return '';
    if (b < 1024 * 1024) return Math.max(1, Math.round(b / 1024)) + ' KB';
    return (b / 1024 / 1024).toFixed(1).replace('.0','') + ' MB';
  }
  function extOf(name){ return (String(name).split('.').pop() || '').slice(0,4).toUpperCase(); }
  const resourcesFor = (itemId) => plan.resources.filter(r => r.item_id === itemId);
  const itemById = (id) => plan.items.find(i => i.id === id);
  const totalSec = () => plan.items.filter(i => i.kind !== 'header').reduce((s, i) => s + i.length_sec, 0);

  // Re-randează tot, dar păstrează ce era scris și nesalvat în formulare (ex. când
  // urci un fișier din panoul lateral în timp ce ai modificat deja titlul).
  const DRAFT_FIELDS = ['f-title','f-len','f-key','f-person','f-notes','f-kind'];
  function setPlan(next, opts){
    plan = next;
    const reopen = openId;
    const draft = {};
    if (reopen !== null) DRAFT_FIELDS.forEach(id => { const el = document.getElementById(id); if (el) draft[id] = el.value; });
    render(opts && opts.details);
    if (reopen !== null) {
      if (itemById(reopen)) {
        openDrawer(reopen);
        Object.entries(draft).forEach(([id, v]) => { const el = document.getElementById(id); if (el) el.value = v; });
      } else closeDrawer();
    }
  }

  // ------------------------------------------------------------ antet + detalii

  function renderHead(){
    const s = plan.sunday;
    document.title = `Pulsul Duminicii — ${formatSlugLong(DATE)}`;
    document.getElementById('title').textContent = 'Duminică, ' + formatSlugLong(DATE);
    const t = totalSec();
    const chips = [
      s.preacher_name ? `Predică: <b>${esc(s.preacher_name)}</b>` : 'Predicator necompletat',
      `${esc(s.start_time)} – ~${clock(s.start_time, t)}`,
      `durată ${formatDuration(t)}`,
    ];
    if (plan.perms.ownSunday) chips.push('predici tu');
    if (plan.isPast && s.attendance != null) chips.push(`${s.attendance} prezenți`);
    document.getElementById('head-meta').innerHTML = chips.map(c => `<span class="chip">${c}</span>`).join('');

    const actions = [];
    if (plan.isPast && PAYLOAD.hasFeedback) actions.push(`<a class="btn" href="/zile/${DATE}">Vezi feedback-ul →</a>`);
    if (plan.perms.admin) actions.push('<button class="btn danger" id="delete-sunday">Șterge duminica</button>');
    document.getElementById('head-actions').innerHTML = actions.join('');
    const del = document.getElementById('delete-sunday');
    if (del) del.addEventListener('click', async () => {
      const ok = await confirmDialog('Programul acestei duminici se șterge cu toate resursele urcate. Nu se poate anula.', { title: 'Ștergi duminica?', ok: 'Șterge duminica', danger: true });
      if (!ok) return;
      try { await withBusy(del, () => api('DELETE', `/api/program/${DATE}`)); startNavProgress(); location.href = '/program'; }
      catch (err) { toast(err.message, true); }
    });

    document.getElementById('updated').textContent = s.updated_at
      ? `Ultima modificare: ${s.updated_at.replace(' ', ' la ').slice(0, 19)} (UTC)${s.updated_by ? ' · ' + s.updated_by : ''}`
      : '';
  }

  function renderDetails(){
    const s = plan.sunday;
    const card = document.getElementById('details-card');
    if (!plan.perms.admin) {
      card.innerHTML = `
        <h3>Detalii</h3>
        <div class="view-field"><span class="lbl">Predicator</span>${esc(s.preacher_name || '—')}</div>
        <div class="view-field" style="margin-top:10px;"><span class="lbl">Ora de început</span>${esc(s.start_time)}</div>
        ${s.notes ? `<div class="view-field" style="margin-top:10px;"><span class="lbl">Notițe</span><div class="notes-view">${esc(s.notes)}</div></div>` : ''}
        <p class="readonly-note" style="margin-top:14px;">${plan.perms.ownSunday
          ? 'Poți modifica elementele din secțiunea PREDICA (și cele unde ești trecut ca persoană) și poți urca resurse oriunde în această duminică.'
          : 'Poți vedea programul. Modifici doar elementele unde ești trecut ca persoană.'}</p>`;
      return;
    }
    card.innerHTML = `
      <h3>Detalii duminică</h3>
      <form id="details-form">
        <div class="settings-grid">
          <label class="field p-name"><span>Predicator</span><input class="input" name="preacher_name" list="preachers-dl" value="${esc(s.preacher_name)}" autocomplete="off"></label>
          <label class="field"><span>Început</span><input class="input" type="time" name="start_time" value="${esc(s.start_time)}"></label>
          <label class="field"><span>Prezență</span><input class="input" type="number" min="0" step="1" name="attendance" value="${s.attendance ?? ''}" placeholder="${plan.isPast ? 'nr. persoane' : 'după întâlnire'}"></label>
          <label class="field wide"><span>Notițe generale</span><textarea class="input" name="notes" rows="2" placeholder="ex. echipa de tehnic, ce se schimbă față de obicei…">${esc(s.notes)}</textarea></label>
        </div>
        <datalist id="preachers-dl">${PAYLOAD.preachers.map(p => `<option value="${esc(p)}">`).join('')}</datalist>
        <div class="info-actions"><button class="btn primary" type="submit">Salvează detaliile</button><span class="muted">Schimbarea predicatorului mută și elementele trecute pe numele lui.</span></div>
      </form>`;
    document.getElementById('details-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const btn = e.target.querySelector('[type=submit]');
      try {
        const next = await withBusy(btn, () => api('PATCH', `/api/program/${DATE}`, {
          preacher_name: fd.get('preacher_name'), start_time: fd.get('start_time'),
          attendance: fd.get('attendance') === '' ? null : Number(fd.get('attendance')), notes: fd.get('notes'),
        }));
        setPlan(next, { details: true });
        toast('Detaliile au fost salvate.');
      } catch (err) { toast(err.message, true); }
    });
  }

  // ------------------------------------------------------------ resurse

  function resourceList(list){
    if (!list.length) return '<p class="res-empty">Nicio resursă încă.</p>';
    return '<div class="res-list">' + list.map(r => `
      <div class="res-item">
        <div class="res-icon">${r.kind === 'link' ? '🔗' : esc(extOf(r.name))}</div>
        <div class="res-body">
          <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a>
          <div class="res-meta">${r.kind === 'link' ? esc(new URL(r.url).hostname) : fmtSize(r.size)} · ${esc(r.uploaded_by)}</div>
        </div>
        ${r.canDelete ? `<button class="res-del" data-del-res="${r.id}" aria-label="Șterge ${esc(r.name)}" title="Șterge">×</button>` : ''}
      </div>`).join('') + '</div>';
  }

  function resourceAdder(itemId){
    const target = itemId === null ? 'null' : itemId;
    return `
      <div class="res-add">
        ${plan.perms.uploadsEnabled
          ? `<div class="drop-zone" data-upload="${target}" tabindex="0" role="button"><b>Urcă fișiere</b> sau trage-le aici · PPT, Keynote, PDF, imagini, audio, video · max 50 MB</div>`
          : '<p class="res-empty">Urcarea de fișiere nu e activată încă (R2). Poți adăuga linkuri.</p>'}
        <form class="res-link-form" data-link="${target}">
          <input class="input" name="name" placeholder="Nume (opțional)">
          <input class="input" name="url" type="url" placeholder="https://… (Drive, Slides, YouTube)" required>
          <button class="btn" type="submit">Adaugă link</button>
        </form>
      </div>`;
  }

  function renderGeneralResources(){
    const el = document.getElementById('general-resources');
    el.innerHTML = resourceList(resourcesFor(null)) + (plan.perms.canAddResource ? resourceAdder(null) : '');
  }

  let pendingUploadTarget = null;
  const fileInput = document.getElementById('file-input');

  // Același POST ca înainte (corp brut, fără multipart), dar prin XHR — fetch nu raportează
  // progresul urcării, iar pe date mobile un fișier de 50 MB durează.
  let currentUpload = null;
  function uploadWithProgress(url, file, onProgress){
    return new Promise((resolve, reject) => {
      if (!navigator.onLine) { reject(new Error(OFFLINE_MSG)); return; }
      const xhr = new XMLHttpRequest();
      currentUpload = xhr;
      xhr.open('POST', url);
      xhr.setRequestHeader('content-type', file.type || 'application/octet-stream');
      xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
      xhr.onload = () => {
        let data = null;
        try { data = JSON.parse(xhr.responseText); } catch(e){}
        if (xhr.status === 401) { location.href = '/login?next=' + encodeURIComponent(location.pathname); reject(new Error('Sesiune expirată.')); return; }
        if (xhr.status < 200 || xhr.status >= 300) { reject(new Error((data && data.error) || `Eroare ${xhr.status}`)); return; }
        markChanged();
        resolve(data);
      };
      xhr.onerror = () => reject(new Error(navigator.onLine ? NETWORK_MSG : OFFLINE_MSG));
      xhr.onabort = () => { const err = new Error('Urcare anulată.'); err.aborted = true; reject(err); };
      xhr.send(file);
    });
  }
  function showUploadPanel(name, counter){
    let panel = document.getElementById('upload-panel');
    if (!panel) {
      panel = document.createElement('div');
      panel.id = 'upload-panel';
      panel.setAttribute('role', 'status');
      panel.innerHTML = '<div class="up-row"><span class="up-name"></span><span class="up-pct">0%</span><button class="btn small" type="button" id="up-cancel">Anulează</button></div><div class="up-bar"><i></i></div>';
      document.body.appendChild(panel);
      panel.querySelector('#up-cancel').addEventListener('click', () => { if (currentUpload) currentUpload.abort(); });
    }
    panel.hidden = false;
    panel.querySelector('.up-name').textContent = (counter ? counter + ' · ' : '') + 'Se urcă ' + name;
    const set = (f) => {
      const pct = Math.round(f * 100);
      panel.querySelector('.up-pct').textContent = pct + '%';
      panel.querySelector('.up-bar i').style.width = pct + '%';
    };
    set(0);
    return { set, done: () => { panel.hidden = true; } };
  }
  async function uploadFiles(files, itemId){
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      if (file.size > MAX_UPLOAD) { toast(`${file.name}: depășește 50 MB.`, true); continue; }
      const progress = showUploadPanel(file.name, files.length > 1 ? `${i + 1}/${files.length}` : '');
      try {
        const q = `item=${itemId === null ? '' : itemId}&name=${encodeURIComponent(file.name)}`;
        setPlan(await uploadWithProgress(`/api/program/${DATE}/resurse?${q}`, file, progress.set));
        toast(`${file.name} a fost urcat.`);
      } catch (err) {
        progress.done();
        if (err.aborted) { toast('Urcare anulată.'); break; } // anularea oprește și fișierele următoare
        toast(`${file.name}: ${err.message}`, true);
      }
      progress.done();
      currentUpload = null;
    }
  }
  fileInput.addEventListener('change', () => {
    const files = [...fileInput.files];
    fileInput.value = '';
    if (files.length) uploadFiles(files, pendingUploadTarget);
  });
  const parseTarget = (v) => v === 'null' ? null : Number(v);

  // Delegare pe tot documentul — resursele apar și în card, și în panoul lateral.
  document.addEventListener('click', async (e) => {
    const up = e.target.closest('[data-upload]');
    if (up) { pendingUploadTarget = parseTarget(up.dataset.upload); fileInput.click(); return; }
    const del = e.target.closest('[data-del-res]');
    if (del) {
      const res = plan.resources.find(r => r.id === Number(del.dataset.delRes));
      const ok = await confirmDialog(res ? `„${res.name}" se șterge pentru toată lumea.` : 'Resursa se șterge pentru toată lumea.', { title: 'Ștergi resursa?', ok: 'Șterge', danger: true });
      if (!ok) return;
      try { setPlan(await api('DELETE', `/api/resurse/${del.dataset.delRes}`)); toast('Resursa a fost ștearsă.'); }
      catch (err) { toast(err.message, true); }
    }
  });
  document.addEventListener('keydown', (e) => {
    const up = e.target.closest && e.target.closest('[data-upload]');
    if (up && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); up.click(); }
  });
  document.addEventListener('submit', async (e) => {
    const form = e.target.closest('[data-link]');
    if (!form) return;
    e.preventDefault();
    const fd = new FormData(form);
    try {
      const next = await withBusy(form.querySelector('[type=submit]'), () =>
        api('POST', `/api/program/${DATE}/linkuri`, { item_id: parseTarget(form.dataset.link), name: fd.get('name'), url: fd.get('url') }));
      setPlan(next);
      toast('Linkul a fost adăugat.');
    } catch (err) { toast(err.message, true); }
  });
  ['dragover','dragenter'].forEach(ev => document.addEventListener(ev, (e) => {
    const z = e.target.closest && e.target.closest('[data-upload]');
    if (z && e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { e.preventDefault(); z.classList.add('over'); }
  }));
  document.addEventListener('dragleave', (e) => { const z = e.target.closest && e.target.closest('[data-upload]'); if (z) z.classList.remove('over'); });
  document.addEventListener('drop', (e) => {
    const z = e.target.closest && e.target.closest('[data-upload]');
    if (!z || !e.dataTransfer || !e.dataTransfer.files.length) return;
    e.preventDefault();
    z.classList.remove('over');
    uploadFiles([...e.dataTransfer.files], parseTarget(z.dataset.upload));
  });

  // ------------------------------------------------------------ planul

  function sectionTotals(){
    const totals = {};
    let current = null;
    for (const i of plan.items) {
      if (i.kind === 'header') { current = i.id; totals[current] = 0; }
      else if (current !== null) totals[current] += i.length_sec;
    }
    return totals;
  }
  function lastIdOfSection(headerId){
    const idx = plan.items.findIndex(i => i.id === headerId);
    let last = headerId;
    for (let k = idx + 1; k < plan.items.length && plan.items[k].kind !== 'header'; k++) last = plan.items[k].id;
    return last;
  }

  function renderPlan(){
    const admin = plan.perms.admin;
    const totals = sectionTotals();
    let offset = 0;
    const rows = plan.items.map(item => {
      const grip = `<span class="grip${admin ? '' : ' off'}" data-grip="${item.id}" aria-hidden="true">${GRIP}</span>`;
      if (item.kind === 'header') {
        const canAdd = item.canAddAfter;
        const lastId = lastIdOfSection(item.id);
        const sectionHasSongs = plan.items.some(i => i.kind === 'song' && i.section === item.title);
        return `
          <div class="plan-row header${admin ? ' clickable' : ''}" data-id="${item.id}">
            ${grip}<span class="c-time"></span>
            <span class="h-title" style="grid-column: span 2;">${esc(item.title || 'SECȚIUNE')}<span class="h-total">${totals[item.id] ? formatDuration(totals[item.id]) : ''}</span></span>
            <span class="add-in-section">${canAdd ? `<button class="btn" data-add="${sectionHasSongs ? 'song' : 'item'}" data-after="${lastId}" title="Adaugă ${sectionHasSongs ? 'o cântare' : 'un element'} în ${esc(item.title)}" aria-label="Adaugă în ${esc(item.title)}">+</button>` : ''}</span>
          </div>`;
      }
      const start = clock(plan.sunday.start_time, offset);
      offset += item.length_sec;
      const n = resourcesFor(item.id).length;
      const sub = [item.person, item.notes].filter(Boolean).join(' · ');
      const titleHtml = item.title
        ? `<span class="txt">${esc(item.title)}</span>`
        : `<span class="txt ph">${item.kind === 'song' ? 'Cântare de ales' : 'Fără titlu'}</span>`;
      return `
        <div class="plan-row${item.canEdit ? '' : ' readonly'}" data-id="${item.id}" tabindex="0">
          ${item.canEdit && !admin ? '<span class="edit-dot" title="Poți modifica"></span>' : ''}
          ${grip}
          <span class="c-time">${start}</span>
          <span class="c-len">${formatDuration(item.length_sec)}</span>
          <span class="c-title">
            <span class="t">${titleHtml}${item.kind === 'song' && item.song_key ? `<span class="key-badge" title="Tonalitate">${esc(item.song_key)}</span>` : ''}</span>
            ${sub ? `<span class="s">${esc(sub)}</span>` : ''}
          </span>
          <span class="c-res">${n ? CLIP + n : ''}</span>
        </div>`;
    }).join('');
    document.getElementById('plan-rows').innerHTML = rows || '<div class="empty-state" style="padding:30px; text-align:center; color:var(--text-3);">Programul e gol.</div>';

    const t = totalSec();
    document.getElementById('plan-foot').innerHTML = `
      <span class="total">Total: <b>${formatDuration(t)}</b> · ${esc(plan.sunday.start_time)} – ~${clock(plan.sunday.start_time, t)}</span>
      ${admin ? `<span style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn small" data-add="song">+ Cântare</button>
        <button class="btn small" data-add="item">+ Element</button>
        <button class="btn small" data-add="header">+ Secțiune</button>
      </span>` : ''}`;
  }

  document.getElementById('plan-rows').addEventListener('click', (e) => {
    if (e.target.closest('[data-add]') || e.target.closest('[data-grip]')) return;
    const row = e.target.closest('.plan-row');
    if (!row) return;
    const item = itemById(Number(row.dataset.id));
    if (item.kind === 'header' && !plan.perms.admin) return;
    openDrawer(item.id);
  });
  document.getElementById('plan-rows').addEventListener('keydown', (e) => {
    const row = e.target.closest('.plan-row');
    if (row && e.key === 'Enter') openDrawer(Number(row.dataset.id));
  });
  document.addEventListener('click', async (e) => {
    const add = e.target.closest('[data-add]');
    if (!add) return;
    const body = { kind: add.dataset.add };
    if (add.dataset.after) body.after_id = Number(add.dataset.after);
    try {
      const before = new Set(plan.items.map(i => i.id));
      setPlan(await api('POST', `/api/program/${DATE}/items`, body));
      const created = plan.items.find(i => !before.has(i.id));
      if (created) openDrawer(created.id);
    } catch (err) { toast(err.message, true); }
  });

  // ---- reordonare prin tragere (doar contul general) ----
  let dragId = null;
  const rowsEl = document.getElementById('plan-rows');
  rowsEl.addEventListener('pointerdown', (e) => {
    const g = e.target.closest('[data-grip]');
    if (!g || !plan.perms.admin) return;
    const row = g.closest('.plan-row');
    row.setAttribute('draggable', 'true');
  });
  rowsEl.addEventListener('dragstart', (e) => {
    const row = e.target.closest('.plan-row');
    if (!row || row.getAttribute('draggable') !== 'true') return;
    dragId = Number(row.dataset.id);
    row.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', String(dragId));
  });
  function clearDropMarks(){ rowsEl.querySelectorAll('.drop-before,.drop-after').forEach(r => r.classList.remove('drop-before','drop-after')); }
  rowsEl.addEventListener('dragover', (e) => {
    if (dragId === null) return;
    const row = e.target.closest('.plan-row');
    if (!row) return;
    e.preventDefault();
    clearDropMarks();
    const rect = row.getBoundingClientRect();
    row.classList.add(e.clientY < rect.top + rect.height / 2 ? 'drop-before' : 'drop-after');
  });
  rowsEl.addEventListener('drop', async (e) => {
    if (dragId === null) return;
    e.preventDefault();
    const row = e.target.closest('.plan-row');
    const before = row && row.classList.contains('drop-before');
    const targetId = row ? Number(row.dataset.id) : null;
    clearDropMarks();
    if (targetId === null || targetId === dragId) return;
    const ids = plan.items.map(i => i.id).filter(id => id !== dragId);
    let at = ids.indexOf(targetId) + (before ? 0 : 1);
    ids.splice(at, 0, dragId);
    await saveOrder(ids);
  });
  rowsEl.addEventListener('dragend', (e) => {
    const row = e.target.closest('.plan-row');
    if (row) { row.classList.remove('dragging'); row.removeAttribute('draggable'); }
    clearDropMarks();
    dragId = null;
  });
  async function saveOrder(ids){
    try { setPlan(await api('PUT', `/api/program/${DATE}/ordine`, { ids })); }
    catch (err) { toast(err.message, true); }
  }
  async function moveBy(id, delta){
    const ids = plan.items.map(i => i.id);
    const idx = ids.indexOf(id);
    const to = idx + delta;
    if (to < 0 || to >= ids.length) return;
    [ids[idx], ids[to]] = [ids[to], ids[idx]];
    await saveOrder(ids);
  }

  // ------------------------------------------------------------ panoul lateral

  let openId = null;
  const drawer = document.getElementById('drawer');
  const overlay = document.getElementById('overlay');

  function closeDrawer(){
    openId = null;
    drawer.hidden = true;
    overlay.hidden = true;
    if (!document.querySelector('dialog.sheet[open]')) document.documentElement.classList.remove('sheet-open');
  }
  document.getElementById('drawer-close').addEventListener('click', closeDrawer);
  enableSwipeDown(drawer.querySelector('.drawer-head'), drawer, closeDrawer);
  overlay.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !drawer.hidden) closeDrawer(); });

  function openDrawer(id){
    const item = itemById(id);
    if (!item) return closeDrawer();
    const wasOpen = openId === id;
    openId = id;
    const admin = plan.perms.admin;
    const body = document.getElementById('drawer-body');
    const foot = document.getElementById('drawer-foot');
    const title = document.getElementById('drawer-title');

    if (item.kind === 'header') {
      title.textContent = 'Secțiune';
      body.innerHTML = `
        <label class="field"><span>Nume secțiune</span><input class="input" id="f-title" value="${esc(item.title)}"></label>
        <p class="readonly-note">Ștergerea unei secțiuni nu șterge elementele ei — ele trec în secțiunea de deasupra.</p>`;
      foot.innerHTML = `
        <button class="btn primary" id="f-save">Salvează</button>
        <button class="btn" id="f-up" title="Mută mai sus">↑</button><button class="btn" id="f-down" title="Mută mai jos">↓</button>
        <span class="spacer"></span><button class="btn danger" id="f-delete">Șterge secțiunea</button>`;
    } else if (item.canEdit) {
      title.textContent = item.title || (item.kind === 'song' ? 'Cântare' : 'Element');
      body.innerHTML = `
        ${admin ? `<label class="field"><span>Tip</span><select class="input" id="f-kind">
          <option value="item"${item.kind==='item'?' selected':''}>Element</option>
          <option value="song"${item.kind==='song'?' selected':''}>Cântare</option></select></label>` : ''}
        <label class="field"><span>${item.kind === 'song' ? 'Titlul cântării' : 'Titlu'}</span><input class="input" id="f-title" value="${esc(item.title)}" placeholder="${item.kind === 'song' ? 'ex. Măreţul har (Aleluia, m-a salvat)' : ''}"></label>
        <div class="drawer-grid">
          <label class="field"><span>Durată (mm:ss)</span><input class="input" id="f-len" value="${formatDuration(item.length_sec)}" inputmode="numeric"></label>
          ${item.kind === 'song'
            ? `<label class="field"><span>Tonalitate</span><input class="input" id="f-key" value="${esc(item.song_key)}" maxlength="8" placeholder="ex. D, Eb, F#m"></label>`
            : '<span></span>'}
        </div>
        <label class="field"><span>Cine (persoană)</span><input class="input" id="f-person" value="${esc(item.person)}" placeholder="ex. Beni sau Bea"></label>
        <label class="field"><span>Notițe</span><textarea class="input" id="f-notes" rows="3">${esc(item.notes)}</textarea></label>
        <h4>Resurse</h4>
        ${resourceList(resourcesFor(item.id))}
        ${item.canAddResource ? resourceAdder(item.id) : ''}`;
      foot.innerHTML = `
        <button class="btn primary" id="f-save">Salvează</button>
        ${admin ? '<button class="btn" id="f-up" title="Mută mai sus">↑</button><button class="btn" id="f-down" title="Mută mai jos">↓</button>' : ''}
        <span class="spacer"></span>
        ${item.canDelete ? '<button class="btn danger" id="f-delete">Șterge</button>' : ''}`;
    } else {
      title.textContent = item.title || (item.kind === 'song' ? 'Cântare' : 'Element');
      body.innerHTML = `
        <div class="drawer-grid">
          <div class="view-field"><span class="lbl">Durată</span>${formatDuration(item.length_sec)}</div>
          ${item.kind === 'song' ? `<div class="view-field"><span class="lbl">Tonalitate</span>${esc(item.song_key || '—')}</div>` : ''}
        </div>
        ${item.person ? `<div class="view-field"><span class="lbl">Cine</span>${esc(item.person)}</div>` : ''}
        ${item.notes ? `<div class="view-field"><span class="lbl">Notițe</span><div class="notes-view">${esc(item.notes)}</div></div>` : ''}
        <h4>Resurse</h4>
        ${resourceList(resourcesFor(item.id))}
        ${item.canAddResource ? resourceAdder(item.id) : ''}`;
      foot.innerHTML = '<button class="btn" id="f-close">Închide</button>';
    }

    const $ = (id) => document.getElementById(id);
    if ($('f-close')) $('f-close').addEventListener('click', closeDrawer);
    if ($('f-up')) $('f-up').addEventListener('click', () => moveBy(item.id, -1));
    if ($('f-down')) $('f-down').addEventListener('click', () => moveBy(item.id, 1));
    if ($('f-delete')) $('f-delete').addEventListener('click', async () => {
      const ok = await confirmDialog(item.kind === 'header'
        ? 'Elementele ei nu se șterg — trec în secțiunea de deasupra.'
        : 'Resursele lui rămân la „Resurse generale".', { title: item.kind === 'header' ? 'Ștergi secțiunea?' : 'Ștergi elementul?', ok: 'Șterge', danger: true });
      if (!ok) return;
      try { closeDrawer(); setPlan(await api('DELETE', `/api/program/${DATE}/items/${item.id}`)); toast('Șters.'); }
      catch (err) { toast(err.message, true); }
    });
    if ($('f-save')) $('f-save').addEventListener('click', async () => {
      const body = { title: $('f-title').value };
      if (item.kind !== 'header') {
        const len = parseDuration($('f-len').value);
        if (len === null) { toast('Durata trebuie scrisă ca mm:ss (ex. 5:30) sau doar minute.', true); return; }
        body.length_sec = len;
        body.person = $('f-person').value;
        body.notes = $('f-notes').value;
        if ($('f-key')) body.song_key = $('f-key').value;
        if ($('f-kind')) body.kind = $('f-kind').value;
      }
      try {
        const next = await withBusy($('f-save'), () => api('PATCH', `/api/program/${DATE}/items/${item.id}`, body));
        setPlan(next); closeDrawer(); toast('Salvat.');
      } catch (err) { toast(err.message, true); }
    });

    drawer.hidden = false;
    overlay.hidden = false;
    document.documentElement.classList.add('sheet-open');
    if (!wasOpen) {
      const first = body.querySelector('input:not([type=hidden]), select, textarea');
      if (first && window.matchMedia('(min-width: 641px)').matches) first.focus();
    }
  }

  // Formularul de detalii se re-randează doar la încărcare și după salvarea lui —
  // altfel o urcare de fișier ar șterge ce ai scris acolo și n-ai salvat încă.
  function render(withDetails){
    renderHead();
    if (withDetails) renderDetails();
    renderGeneralResources();
    renderPlan();
  }
  render(true);
})();
</script>
</body>
</html>

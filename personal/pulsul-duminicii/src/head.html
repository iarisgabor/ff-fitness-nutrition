<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F1F3F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#090C13" media="(prefers-color-scheme: dark)">
<script>try{var t=localStorage.getItem('puls-theme');if(t){document.documentElement.setAttribute('data-theme',t);document.querySelectorAll('meta[name=theme-color]').forEach(function(m){m.content=t==='dark'?'#090C13':'#F1F3F8';});}}catch(e){}</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>

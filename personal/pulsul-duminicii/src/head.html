<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F1F3F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#090C13" media="(prefers-color-scheme: dark)">
<script>try{var t=localStorage.getItem('puls-theme');if(t){document.documentElement.setAttribute('data-theme',t);document.querySelectorAll('meta[name=theme-color]').forEach(function(m){m.content=t==='dark'?'#090C13':'#F1F3F8';});}}catch(e){}</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pulsul">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<!-- Nu arăta pagina pe jumătate construită: afișarea așteaptă markerul #randat, pus de render.js
     la finalul <body>, după scripturi (care construiesc barele și conținutul). Chrome 124+. -->
<link rel="expect" href="#randat" blocking="render">
<!-- Paginile următoare se pregătesc în fundal (Chrome, deci și aplicația Android): tab-urile din
     bara de jos / sus imediat, orice alt link când e atins. ATENȚIE: o rută GET cu efecte (ca
     /logout) TREBUIE exclusă aici — prerender-ul chiar o accesează. Vezi CLAUDE.md, regula 32. -->
<script type="speculationrules" id="spec-rules">
{
  "prerender": [
    {
      "where": { "and": [
        { "selector_matches": ".bn-item, .nav-tab, .subnav-tab, .app-back" },
        { "not": { "selector_matches": "[aria-current]" } },
        { "not": { "href_matches": "/logout*" } },
        { "not": { "href_matches": "/login*" } }
      ]},
      "eagerness": "immediate"
    },
    {
      "where": { "and": [
        { "href_matches": "/*" },
        { "not": { "href_matches": "/logout*" } },
        { "not": { "href_matches": "/login*" } },
        { "not": { "href_matches": "/api/*" } },
        { "not": { "href_matches": "/resurse/*" } },
        { "not": { "selector_matches": "[target], [download]" } }
      ]},
      "eagerness": "moderate"
    }
  ]
}
</script>

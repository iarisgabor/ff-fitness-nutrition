name = "pulsul-duminicii"
main = "src/index.js"
compatibility_date = "2026-08-21"

# Șabloanele (.html), stilurile comune (.css) și scriptul comun (.txt) sunt
# importate ca text brut, nu servite static — vezi src/render.js
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/*.txt"]
fallthrough = true

[vars]
# "accounts" = login cu cont (implicit): ADMIN_USERNAME vede tot, predicatorii
# (creați din /admin/conturi) își văd statisticile și programul.
# "none" = fără parolă, toată lumea e admin (doar pentru teste locale).
# "password" = Basic Auth cu SITE_PASSWORD. "access" = Cloudflare Access (nimic
# de configurat aici, doar în dashboard Zero Trust).
AUTH_MODE = "accounts"
# Contul general. Parola: hash-ul de mai jos (parolă aleatoare generată cu
# `node scripts/admin-password.mjs` — pentru o parolă nouă rulezi scriptul și
# înlocuiești linia). Secretul ADMIN_PASSWORD, dacă e setat, are prioritate.
ADMIN_USERNAME = "BisericaLogos"
ADMIN_PASSWORD_HASH = "pbkdf2$100000$2e73fc443a5a86582f785472c8e7f307$e5cc67e62f2024a33b59fdd4e0692f0d36e52d3a4fff166eecd6d8eadbd72dd7"
GOOGLE_SHEET_ID = "1NIRVF-Dfxbu3BweApf9eWhMW80ZLeXw6RGPAVAQieic"
# "Calendar predicare" — cine predică în fiecare duminică, Sheet SEPARAT de cel
# de mai sus. Service account-ul trebuie adăugat Viewer și pe acesta (vezi README).
PREACHERS_SHEET_ID = "1LVHzHB4z_dGm5v9xsnp_i2NotgUVGnBdmzpv3XsWpN0"

# Rulează întâi:
#   wrangler kv namespace create PULSUL_KV
# și pune id-ul rezultat mai jos.
[[kv_namespaces]]
binding = "PULSUL_KV"
id = "f6570857beb34a71a17142234f3b7e7a"

# Program duminică + conturi predicatori. Creează o singură dată:
#   npx wrangler d1 create pulsul-duminicii
# pune database_id-ul rezultat mai jos, apoi:
#   npx wrangler d1 migrations apply DB --remote
[[d1_databases]]
binding = "DB"
database_name = "pulsul-duminicii"
database_id = "COMPLETEAZA-DUPA-wrangler-d1-create"
migrations_dir = "migrations"

# Fișierele urcate la program (PPT, PDF, slide-uri). Bucket PRIVAT — se descarcă
# doar prin Worker, după login. R2 trebuie activat o dată din dashboard, apoi:
#   npx wrangler r2 bucket create pulsul-resurse
[[r2_buckets]]
binding = "RESURSE"
bucket_name = "pulsul-resurse"

# Secrete — NICIODATĂ aici, doar prin:
#   wrangler secret put ADMIN_PASSWORD           (opțional — altfel ADMIN_PASSWORD_HASH)
#   wrangler secret put GOOGLE_SERVICE_ACCOUNT_EMAIL
#   wrangler secret put GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
#   wrangler secret put SITE_PASSWORD          (doar dacă AUTH_MODE = "password")
#   wrangler secret put ANTHROPIC_API_KEY       (opțional — activează rezumatul AI)

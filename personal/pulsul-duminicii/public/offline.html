<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Pulsul Duminicii — offline</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F1F3F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#090C13" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- Pagină statică, servită de service worker când nu e conexiune și pagina cerută nu a
     fost salvată pe acest dispozitiv. Culorile sunt aceleași token-uri ca în src/shared.css. -->
<script>try{var t=localStorage.getItem('puls-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
@font-face{font-family:'Manrope'; font-weight:200 800; font-display:swap; src:url(/fonts/manrope-latin.woff2) format('woff2');}
@font-face{font-family:'Manrope'; font-weight:200 800; font-display:swap; src:url(/fonts/manrope-ro.woff2) format('woff2'); unicode-range:U+0102-0103,U+015E-015F,U+0162-0163,U+0218-021B;}
@font-face{font-family:'Sora'; font-weight:100 800; font-display:swap; src:url(/fonts/sora-latin.woff2) format('woff2');}
@font-face{font-family:'Sora'; font-weight:100 800; font-display:swap; src:url(/fonts/sora-ro.woff2) format('woff2'); unicode-range:U+0102-0103,U+015E-015F,U+0162-0163,U+0218-021B;}
:root{--bg:#F1F3F8; --surface:#FFFFFF; --surface-2:#E8ECF3; --border:#D5DCE6; --text:#12172A; --text-2:#4A5468; --text-3:#7C879C; --accent:#4A3AA7; --accent2:#EB6834; color-scheme:light;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--bg:#090C13; --surface:#121826; --surface-2:#1A2233; --border:#2B3549; --text:#EEF1F7; --text-2:#A6B0C3; --text-3:#6B7488; --accent:#9085E9; --accent2:#D95926; color-scheme:dark;} }
:root[data-theme="dark"]{--bg:#090C13; --surface:#121826; --surface-2:#1A2233; --border:#2B3549; --text:#EEF1F7; --text-2:#A6B0C3; --text-3:#6B7488; --accent:#9085E9; --accent2:#D95926; color-scheme:dark;}
*{box-sizing:border-box;}
body{margin:0; min-height:100dvh; background:var(--bg); color:var(--text); font-family:'Manrope', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; display:flex; align-items:center; justify-content:center; padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));}
.card{width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:28px 22px;}
.brand{display:flex; align-items:center; gap:10px; font-family:'Sora', ui-sans-serif, system-ui, sans-serif; font-weight:700; font-size:14px; letter-spacing:.02em; margin-bottom:22px;}
.brand svg{width:26px; height:26px;}
h1{font-family:'Sora', ui-sans-serif, system-ui, sans-serif; font-size:22px; margin:0;}
p{font-size:14.5px; line-height:1.55; color:var(--text-2); margin:8px 0 0;}
.btn{display:flex; align-items:center; justify-content:center; width:100%; min-height:48px; margin-top:20px; border-radius:12px; border:1px solid var(--accent); background:var(--accent); color:#fff; font:inherit; font-size:15px; font-weight:700; cursor:pointer;}
h2{font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); margin:26px 0 8px;}
.list{display:flex; flex-direction:column; gap:6px;}
.list a{display:flex; align-items:center; justify-content:space-between; min-height:48px; padding:0 14px; border-radius:12px; background:var(--surface-2); color:var(--text); text-decoration:none; font-size:14.5px; font-weight:600;}
.list a span{color:var(--text-3);}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><svg viewBox="0 0 26 26" fill="none"><path d="M1 13H7L10 4L16 22L19 13H25" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>PULSUL DUMINICII</div>
  <h1>Ești offline</h1>
  <p>Pagina asta nu a fost deschisă încă pe acest dispozitiv, deci nu e salvată. Paginile pe care le-ai deschis cu conexiune se pot vedea și fără semnal.</p>
  <button class="btn" type="button" onclick="location.reload()">Încearcă din nou</button>
  <div id="saved" hidden>
    <h2>Salvate pe acest dispozitiv</h2>
    <div class="list" id="saved-list"></div>
  </div>
</main>
<script>
(function(){
  var MONTHS = ['ianuarie','februarie','martie','aprilie','mai','iunie','iulie','august','septembrie','octombrie','noiembrie','decembrie'];
  function day(slug){ var p = slug.split('-').map(Number); return p[2] + ' ' + MONTHS[p[1]-1] + ' ' + p[0]; }
  var LABELS = [
    [/^\/$/, function(){ return 'Acasă'; }],
    [/^\/eu$/, function(){ return 'Statisticile mele'; }],
    [/^\/program$/, function(){ return 'Program duminică'; }],
    [/^\/program\/(\d{4}-\d{2}-\d{2})$/, function(m){ return 'Program · ' + day(m[1]); }],
    [/^\/zile$/, function(){ return 'Răspunsuri pe zile'; }],
    [/^\/zile\/(\d{4}-\d{2}-\d{2})$/, function(m){ return 'Feedback · ' + day(m[1]); }],
    [/^\/categorii$/, function(){ return 'Analiză pe categorii'; }],
    [/^\/categorii\/[a-z0-9]+$/, function(){ return 'O categorie'; }],
    [/^\/predicatori$/, function(){ return 'Predicatori'; }],
    [/^\/predicatori\/[a-z0-9-]+$/, function(){ return 'Un predicator'; }],
  ];
  if (!('caches' in window)) return;
  caches.has('puls-pages').then(function(has){ return has ? caches.open('puls-pages').then(function(c){ return c.keys(); }) : []; }).then(function(keys){
    var items = keys.map(function(k){
      var path = new URL(k.url).pathname;
      for (var i = 0; i < LABELS.length; i++) { var m = path.match(LABELS[i][0]); if (m) return { path: path, label: LABELS[i][1](m) }; }
      return null;
    }).filter(Boolean).sort(function(a, b){ return a.path < b.path ? -1 : 1; });
    if (!items.length) return;
    var list = document.getElementById('saved-list');
    items.forEach(function(it){
      var a = document.createElement('a');
      a.href = it.path;
      a.textContent = it.label;
      var arrow = document.createElement('span'); arrow.textContent = '›'; a.appendChild(arrow);
      list.appendChild(a);
    });
    document.getElementById('saved').hidden = false;
  }).catch(function(){});
})();
</script>
</body>
</html>

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// Adresa site-ului: implicit cel live. Pentru date de test: -PbaseUrl=http://localhost:8788
// (cu `npm run dev:app` pe calculator și `adb reverse tcp:8788 tcp:8788`).
def baseUrl = project.findProperty('baseUrl') ?: 'https://pulsul-duminicii.iarisgabor.workers.dev'

android {
    namespace 'ro.bisericalogos.pulsul.nativ'
    compileSdk 36

    defaultConfig {
        applicationId 'ro.bisericalogos.pulsul.nativ'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'BASE_URL', "\"${baseUrl}\""
    }

    buildTypes {
        debug {
            // semnat cu cheia de debug a calculatorului; instalat direct, nu prin Google Play
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2025.09.00')
    implementation composeBom

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.3'
    implementation 'androidx.navigation:navigation-compose:2.9.4'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    testImplementation 'junit:junit:4.13.2'
}

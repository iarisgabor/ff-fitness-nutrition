<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem('puls-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pulsul Duminicii — Analiză pe categorii</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
__SHARED_CSS__

.page-head{padding:48px 0 8px;}
.page-head h1{font-size:clamp(26px,3.2vw,36px); font-weight:700;}
.page-head p{margin-top:10px; font-size:14.5px; color:var(--text-2); max-width:60ch;}

.cats-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; padding:40px 0 80px;}
.cat-card{
  display:flex; flex-direction:column; gap:16px; padding:22px 22px 20px;
  text-decoration:none; color:inherit; border-left:4px solid var(--r3);
}
.cat-card .c-label{font-family:'Sora'; font-weight:700; font-size:17px;}
.cat-card .c-full{font-size:12.5px; color:var(--text-3); line-height:1.45; font-style:italic;}
.cat-card .c-row{display:flex; align-items:center; justify-content:space-between; margin-top:auto;}
.cat-card .c-n{font-size:12.5px; color:var(--text-2);}
.cat-card .c-avg{font-family:'IBM Plex Mono'; font-weight:700; font-size:18px;}
.cat-card:hover{border-left-color:var(--accent-mark); box-shadow:var(--shadow), 0 0 0 1px var(--accent-mark) inset;}

.empty-state{padding:60px 0; text-align:center; color:var(--text-3);}
</style>
</head>
<body>

<div id="tooltip"></div>
<div class="topbar" id="topbar-root"></div>
<div id="stale-banner" class="stale-banner" hidden></div>

<div class="wrap">
  <div class="page-head">
    <h1>Analiză pe categorii</h1>
    <p>Alege o categorie ca să vezi cum a evoluat în timp — interval selectabil, cel mai bun și cel mai slab moment, distribuția notelor.</p>
  </div>
  <div class="cats-grid" id="cats-grid"></div>
</div>

<script>
__SHARED_JS__
</script>
<script>
(function(){
  const PAYLOAD = __PULS_DATA_JSON__;
  const DIMS = PAYLOAD.dims || [];
  const META = PAYLOAD.meta || {};

  initNav('categories', `${META.totalResponses||0} răspunsuri · ${META.dateRangeLabel||''}`);

  if (META.stale) {
    const banner = document.getElementById('stale-banner');
    banner.hidden = false;
    banner.textContent = 'Date posibil neactualizate — nu am reușit să citim Sheet-ul live la ultima încercare; se arată ultima versiune bună cunoscută.';
  }

  const grid = document.getElementById('cats-grid');
  if (!DIMS.length) {
    grid.outerHTML = '<div class="empty-state">Niciun răspuns găsit încă.</div>';
    return;
  }

  DIMS.forEach(d => {
    const avgColor = d.n ? `var(--r${Math.max(1,Math.min(5,Math.round(d.avg)))})` : 'var(--r3)';
    const a = document.createElement('a');
    a.className = 'card cat-card';
    a.href = `/categorii/${d.key}`;
    a.style.borderLeftColor = avgColor;
    a.innerHTML = `
      <div>
        <div class="c-label">${esc(d.label)}</div>
        <div class="c-full">${esc(d.full)}</div>
      </div>
      <div class="c-row">
        <div class="c-n">${d.n} ${d.n===1?'răspuns':'răspunsuri'}</div>
        <div class="c-avg" style="color:${avgColor}">${d.n ? d.avg.toFixed(2) : '–'}</div>
      </div>
    `;
    grid.appendChild(a);
  });
})();
</script>
</body>
</html>
